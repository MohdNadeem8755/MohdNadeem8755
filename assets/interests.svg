<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 580" role="img" font-family="Arial,Helvetica,sans-serif"><title>Education, capabilities and rotating research interests</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#0a1427"/><stop offset=".6" stop-color="#070c17"/><stop offset="1" stop-color="#11182a"/></linearGradient><linearGradient id="edge"><stop stop-color="#147bff"/><stop offset=".53" stop-color="#5e56d7"/><stop offset="1" stop-color="#ff304e"/></linearGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="#2a3b59" opacity=".65"/></pattern></defs><style>.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}.a{animation:phase 12s steps(1,end) infinite}.b{opacity:0;animation:phase 12s steps(1,end) -8s infinite}.c{opacity:0;animation:phase 12s steps(1,end) -4s infinite}@keyframes phase{0%,32%{opacity:1}33%,100%{opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite alternate}@keyframes pulse{to{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.b,.c{opacity:0!important}}</style><rect x="1" y="1" width="1078" height="578" rx="24" fill="url(#bg)" stroke="url(#edge)"/><rect x="2" y="2" width="1076" height="576" rx="23" fill="url(#dots)" stroke="none"/><text x="47" y="54" fill="#98baff" font-size="13" font-weight="550" class="mono" letter-spacing="1.7">02 / ABOUT &amp; INTERESTS</text><text x="45" y="109" fill="#f4f7ff" font-size="44" font-weight="600" >What I work on</text><text x="46" y="146" fill="#a8bad8" font-size="18" font-weight="600" >Data, evidence and the algorithms behind my projects.</text><rect x="45" y="182" width="390" height="246" rx="20" fill="#0d182c" stroke="#2b4567"/><rect x="457" y="182" width="578" height="246" rx="20" fill="#0d182c" stroke="#2b4567"/><text x="66" y="216" fill="#98baff" font-size="13" font-weight="550" class="mono" letter-spacing="1.7">CAPABILITIES IN PRACTICE</text><text x="482" y="216" fill="#98baff" font-size="13" font-weight="550" class="mono" letter-spacing="1.7">WHAT I’M EXPLORING</text><circle cx="77" cy="253" r="8" fill="#2583ff"/><text x="74" y="257" fill="#08101c" font-size="10" font-weight="600" >✓</text><text x="98" y="260" fill="#f4f7ff" font-size="21" font-weight="600" >Python &amp; data analysis</text><circle cx="77" cy="296" r="8" fill="#ff3f58"/><text x="74" y="300" fill="#08101c" font-size="10" font-weight="600" >✓</text><text x="98" y="303" fill="#f4f7ff" font-size="21" font-weight="600" >Predictive modelling</text><circle cx="77" cy="339" r="8" fill="#848aff"/><text x="74" y="343" fill="#08101c" font-size="10" font-weight="600" >✓</text><text x="98" y="346" fill="#f4f7ff" font-size="21" font-weight="600" >DSA &amp; problem solving</text><circle cx="77" cy="382" r="8" fill="#55c8c7"/><text x="74" y="386" fill="#08101c" font-size="10" font-weight="600" >✓</text><text x="98" y="389" fill="#f4f7ff" font-size="21" font-weight="600" >Web apps &amp; databases</text><g class="a"><text x="482" y="284" fill="#f4f7ff" font-size="32" font-weight="600" >Variant interpretation</text><text x="482" y="335" fill="#f4f7ff" font-size="21" font-weight="600" >Trace ClinVar annotations over time and</text><text x="482" y="362" fill="#f4f7ff" font-size="21" font-weight="600" >compare them with gene-level evidence.</text><rect x="483" y="402" width="151" height="4" rx="2" fill="#2385ff" stroke="none"/><rect x="655" y="402" width="151" height="4" rx="2" fill="#263954" stroke="none"/><rect x="827" y="402" width="151" height="4" rx="2" fill="#263954" stroke="none"/></g><g class="b"><text x="482" y="284" fill="#f4f7ff" font-size="32" font-weight="600" >Transport forecasting</text><text x="482" y="335" fill="#f4f7ff" font-size="21" font-weight="600" >Estimate passenger demand by route,</text><text x="482" y="362" fill="#f4f7ff" font-size="21" font-weight="600" >month and day of the week.</text><rect x="483" y="402" width="151" height="4" rx="2" fill="#263954" stroke="none"/><rect x="655" y="402" width="151" height="4" rx="2" fill="#2385ff" stroke="none"/><rect x="827" y="402" width="151" height="4" rx="2" fill="#263954" stroke="none"/></g><g class="c"><text x="482" y="284" fill="#f4f7ff" font-size="32" font-weight="600" >Graph algorithms</text><text x="482" y="335" fill="#f4f7ff" font-size="21" font-weight="600" >Use directed graphs and priority queues</text><text x="482" y="362" fill="#f4f7ff" font-size="21" font-weight="600" >to resolve competing tasks.</text><rect x="483" y="402" width="151" height="4" rx="2" fill="#263954" stroke="none"/><rect x="655" y="402" width="151" height="4" rx="2" fill="#263954" stroke="none"/><rect x="827" y="402" width="151" height="4" rx="2" fill="#2385ff" stroke="none"/></g><text x="47" y="472" fill="#98baff" font-size="13" font-weight="550" class="mono" letter-spacing="1.7">CURRENT TRACK</text><text x="46" y="513" fill="#f4f7ff" font-size="25" font-weight="600" >CSE · Artificial Intelligence &amp; Machine Learning</text><text x="47" y="546" fill="#a8bad8" font-size="17" font-weight="600" >Lovely Professional University · August 2024 – present</text></svg>